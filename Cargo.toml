[workspace]
resolver = "3"
members = [
  "cli",
  "lapse",
  "template"
]

[workspace.dependencies]
thiserror = "2.0.18"
tempfile = "3.27.0"
lapse = { path = "lapse", version = "0.2.2" }
lapse-template = { path = "template", version = "0.2.2" }
serde = { version = "1.0.228", features = ["derive"] }

[workspace.package]
version = "0.2.2"
