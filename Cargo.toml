[workspace]
resolver = "3"
members = [
  "cli",
  "config",
  "lapse",
  "template"
]

[workspace.dependencies]
thiserror = "2.0.18"
tempfile = "3.27.0"
lapse = { path = "lapse", version = "0.4.0" }
lapse-template = { path = "template", version = "0.4.0" }
lapse-config = { path = "config", version = "0.4.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[workspace.package]
version = "0.4.0"
