[package]
name = "lapse-cli"
version = { workspace = true }
edition = "2024"
authors = ["Gabriel C. Brandão <biel.brandao2004@gmailcom>"]
repository = "https://github.com/gab1618/lapse"
homepage = "https://github.com/gab1618/lapse"
license = "GPLv3"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.7"
inquire = "0.9.4"
lapse = { workspace = true }
tokio = { version = "1.52.3", features = ["full"] }
thiserror = { workspace = true }
nucleo-matcher = "0.3.1"
minus = { version = "5.7.2", features = ["static_output"] }
is-terminal = "0.4.17"
lapse-template = { workspace = true }

[[bin]]
name = "lapse"
path = "src/main.rs"
